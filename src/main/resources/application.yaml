spring:
  application:
    name: reops-bigquery-consumer
  kafka:
    bootstrap-servers: localhost:9094
    website-topic: website
    listener:
      ack-mode: batch
      concurrency: 8
      type: batch
      poll-timeout: 1000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: reops-bigquery-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: no.nav.reops.event.EnrichedEvent
        spring.json.trusted.packages: "*"
        max.poll.records: 500
        max.poll.interval.ms: 350000
        fetch.max.bytes: 1048576  # 1 MB
        fetch.min.bytes: 1
        fetch.max.wait.ms: 1000   # 1 second batch window
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
    web-application-type: servlet
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /internal/
      exposure:
        include: info, health, metrics, prometheus

reops:
  bigquery:
    tables:
      website-event: public_website_event
      event-data: public_event_data
      session: public_session
      session-data: public_session_data
      website: public_website

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    no.nav.reops: INFO
    org.apache.kafka.clients.NetworkClient: WARN
    org.apache.kafka.clients.Metadata: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN
