apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-enriched-to-bigquery
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  port: 8080
  envFrom:
    - secret: reops-enriched-to-bigquery-sa
  liveness:
    path: /internal/health
    initialDelay: 30
  readiness:
    path: /internal/health
    initialDelay: 5
  replicas:
    min: 1
    max: 2
    scalingStrategy:
      kafka:
        topic: team-researchops.analytics-enriched
        consumerGroup: reops-enriched-to-bigquery
        threshold: 100
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "400m"
      memory: 124Mi
  kafka:
    pool: nav-dev
  accessPolicy:
    outbound:
      external:
        - host: nav-dev-kafka-nav-dev.aivencloud.com
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: kubernetes
    - name: GCP_TEAM_PROJECT_ID
      value: "team-researchops-dev-4396"
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:+UseZGC
        -XX:MaxRAMPercentage=70
        -XX:InitialRAMPercentage=50
        -XX:+ExitOnOutOfMemoryError
  strategy:
    type: Recreate