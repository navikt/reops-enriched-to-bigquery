name: "Deploy Test (Manual)"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build, including a PR's source branch in this repository"
        type: string
        default: main

concurrency:
  group: deploy-test-manual
  cancel-in-progress: false

jobs:
  deploy-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest-8-cores
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
      - name: Require test Spring profile in selected branch
        run: test -f src/main/resources/application-kubernetes-test.yaml
      - name: Build and push test image
        id: image
        uses: nais/docker-build-push@v0
        with:
          team: team-researchops
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: test
          build_args: CI=true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy enriched-to-bigquery to test
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-test.yaml
          VAR: image=${{ steps.image.outputs.image }}
